<!DOCTYPE html>
<html lang="zh">
<head>

</head>
<body class="subpage">

</header>

<main class="about gallery">
  <section class="block">

    <div class="gallery-grid" id="gGrid"></div>
  </section>

  <footer class="sub-foot">
    <span>Zhengzhou Auken Machinery Equipment Co., Ltd.</span>
  </footer>
</main>
<script src="subi18n.js"></script>
<!-- <<<AUKEN_GALLERY_START>>> -->
<script>
  var G = {
    "qm435a": {
      zh: { name: "QM4-35A", desc: "QM4-35A 实拍图集" },
      en: { name: "QM4-35A", desc: "QM4-35A photo gallery" },
      fr: { name: "QM4-35A", desc: "Galerie photos QM4-35A" },
      ar: { name: "QM4-35A", desc: "معرض صور QM4-35A" },
      imgs: ["QM4-35A/QM4-35A-1.webp"]
    },
    "qm435b": {
      zh: { name: "QM4-35B", desc: "QM4-35B 实拍图集" },
      en: { name: "QM4-35B", desc: "QM4-35B photo gallery" },
      fr: { name: "QM4-35B", desc: "Galerie photos QM4-35B" },
      ar: { name: "QM4-35B", desc: "معرض صور QM4-35B" },
      imgs: ["QM4-35B/QM4-35B-1.webp"]
    },
    "qmy435c": {
      zh: { name: "QMY4-35C", desc: "QMY4-35C 实拍图集" },
      en: { name: "QMY4-35C", desc: "QMY4-35C photo gallery" },
      fr: { name: "QMY4-35C", desc: "Galerie photos QMY4-35C" },
      ar: { name: "QMY4-35C", desc: "معرض صور QMY4-35C" },
      imgs: ["QMY4-35C/QMY4-35C-1.webp"]
    },
    "qm440a": {
      zh: { name: "QM4-40A", desc: "QM4-40A 实拍图集" },
      en: { name: "QM4-40A", desc: "QM4-40A photo gallery" },
      fr: { name: "QM4-40A", desc: "Galerie photos QM4-40A" },
      ar: { name: "QM4-40A", desc: "معرض صور QM4-40A" },
      imgs: ["QM4-40A/QM4-40A-1.webp"]
    },
    "qm440b": {
      zh: { name: "QM4-40B", desc: "QM4-40B 实拍图集" },
      en: { name: "QM4-40B", desc: "QM4-40B photo gallery" },
      fr: { name: "QM4-40B", desc: "Galerie photos QM4-40B" },
      ar: { name: "QM4-40B", desc: "معرض صور QM4-40B" },
      imgs: ["QM4-40B/QM4-40B-1.webp"]
    },
    "qm426": {
      zh: { name: "QM4-26", desc: "QM4-26 实拍图集" },
      en: { name: "QM4-26", desc: "QM4-26 photo gallery" },
      fr: { name: "QM4-26", desc: "Galerie photos QM4-26" },
      ar: { name: "QM4-26", desc: "معرض صور QM4-26" },
      imgs: ["QM4-26/QM4-26-1.webp"]
    }
  };
  var lang = (function(){ try { return sessionStorage.getItem('auken_lang'); } catch(e){ return null; } })() || document.documentElement.lang || 'zh';
  var m = (location.search.match(/[?&]m=([^&]+)/) || [,''])[1];
  var d = G[m];
  var gTitle = document.getElementById('gTitle');
  var gDesc = document.getElementById('gDesc');
  var grid = document.getElementById('gGrid');
  if (!d) {
    gTitle.textContent = '暂无图集';
    gDesc.textContent = '该型号暂未上传图片，敬请期待。';
  } else {
    gTitle.textContent = d[lang].name;
    gDesc.textContent = d[lang].desc;
    if (!d.imgs || !d.imgs.length) {
      var empty = document.createElement('p');
      empty.className = 'gallery-empty';
      empty.textContent = '暂无图片';
      grid.appendChild(empty);
    } else {
      d.imgs.forEach(function (src) {
        var fig = document.createElement('figure');
        fig.className = 'gallery-item';
        var im = document.createElement('img');
        im.src = 'img/' + src; im.alt = d[lang].name; im.loading = 'lazy';
        fig.appendChild(im);
        grid.appendChild(fig);
      });
    }
  }
  (function () {
    var back = document.getElementById('subBack');
    if (!back) return;
    var ref = document.referrer || '';
    var sameSite = ref.indexOf(location.protocol + '//' + location.host) === 0;
    back.addEventListener('click', function (e) {
      if (sameSite && history.length > 1) { e.preventDefault(); history.back(); }
    });
  })();
</script>
    <!-- <<<AUKEN_GALLERY_END>>> -->

<script src="cart.js"></script>
</body>
</html>
