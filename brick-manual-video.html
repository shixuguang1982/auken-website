<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pt_video">试机视频 · Auken Machinery</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="subpage">
<header class="sub-head">

  <span class="sub-brand">AUKEN</span>
</header>

<main class="about gallery video-gallery">
  <section class="block">
    <h2 class="block-title" id="vTitle">试机视频</h2>
    <p class="block-desc" id="vDesc"></p>
    <div class="video-grid" id="vGrid"></div>
    <p class="video-note" data-i18n="bm_video_note">视频为占位演示素材（竖屏 ≤15 秒），上线前替换为真实试机录像。</p>
  </section>

  <footer class="sub-foot">
    <span>Zhengzhou Auken Machinery Equipment Co., Ltd.</span>
  </footer>
</main>
<script src="subi18n.js"></script>
<!-- <<<AUKEN_VIDEO_START>>> -->
<script>
  var V = {
    "qmy1": {
      zh: { name: "QMY-1", desc: "QMY-1 试机视频" },
      en: { name: "QMY-1", desc: "QMY-1 test-run video" },
      fr: { name: "QMY-1", desc: "Vidéo d'essai QMY-1" },
      ar: { name: "QMY-1", desc: "فيديو تجربة QMY-1" },
      vids: []
    },
    "qmy4": {
      zh: { name: "QMY-4", desc: "QMY-4 试机视频" },
      en: { name: "QMY-4", desc: "QMY-4 test-run video" },
      fr: { name: "QMY-4", desc: "Vidéo d'essai QMY-4" },
      ar: { name: "QMY-4", desc: "فيديو تجربة QMY-4" },
      vids: []
    },
    "qmy245a": {
      zh: { name: "QMY2-45A", desc: "QMY2-45A 试机视频" },
      en: { name: "QMY2-45A", desc: "QMY2-45A test-run video" },
      fr: { name: "QMY2-45A", desc: "Vidéo d'essai QMY2-45A" },
      ar: { name: "QMY2-45A", desc: "فيديو تجربة QMY2-45A" },
      vids: []
    },
    "qmy245b": {
      zh: { name: "QMY2-45B", desc: "QMY2-45B 试机视频" },
      en: { name: "QMY2-45B", desc: "QMY2-45B test-run video" },
      fr: { name: "QMY2-45B", desc: "Vidéo d'essai QMY2-45B" },
      ar: { name: "QMY2-45B", desc: "فيديو تجربة QMY2-45B" },
      vids: []
    },
    "qmy445a": {
      zh: { name: "QMY4-45A", desc: "QMY4-45A 试机视频" },
      en: { name: "QMY4-45A", desc: "QMY4-45A test-run video" },
      fr: { name: "QMY4-45A", desc: "Vidéo d'essai QMY4-45A" },
      ar: { name: "QMY4-45A", desc: "فيديو تجربة QMY4-45A" },
      vids: []
    },
    "qmy445b": {
      zh: { name: "QMY4-45B", desc: "QMY4-45B 试机视频" },
      en: { name: "QMY4-45B", desc: "QMY4-45B test-run video" },
      fr: { name: "QMY4-45B", desc: "Vidéo d'essai QMY4-45B" },
      ar: { name: "QMY4-45B", desc: "فيديو تجربة QMY4-45B" },
      vids: []
    }
  };
  var lang = (function(){ try { return sessionStorage.getItem('auken_lang'); } catch(e){ return null; } })() || document.documentElement.lang || 'zh';
  var m = (location.search.match(/[?&]m=([^&]+)/) || [,''])[1];
  var d = V[m];
  var vTitle = document.getElementById('vTitle');
  var vDesc = document.getElementById('vDesc');
  var grid = document.getElementById('vGrid');
  if (!d) {
    vTitle.textContent = '暂无视频';
    vDesc.textContent = '该型号暂未上传试机视频，敬请期待。';
  } else {
    vTitle.textContent = d[lang].name;
    vDesc.textContent = d[lang].desc;
    if (!d.vids || !d.vids.length) {
      var empty = document.createElement('p');
      empty.className = 'video-empty';
      empty.textContent = '暂无视频';
      grid.appendChild(empty);
    } else {
      d.vids.forEach(function (src) {
        var item = document.createElement('div');
        item.className = 'video-item';
        var v = document.createElement('video');
        v.src = 'vid/' + src; v.controls = true; v.playsInline = true;
        v.setAttribute('preload', 'metadata');
        var cap = document.createElement('div');
        cap.className = 'video-cap';
        cap.textContent = d[lang].name + ' — ' + src.replace(/\.mp4$/, '');
        item.appendChild(v);
        item.appendChild(cap);
        grid.appendChild(item);
      });
    }
  }
  (function () {
    var back = document.getElementById('subBack');
    if (!back) return;
    var ref = document.referrer || '';
    var sameSite = ref.indexOf(location.protocol + '//' + location.host) === 0;
    back.addEventListener('click', function (e) {
      if (sameSite && history.length > 1) { e.preventDefault(); history.back(); }
    });
  })();
</script>
    <!-- <<<AUKEN_VIDEO_END>>> -->

<script src="cart.js"></script>
</body>
</html>
