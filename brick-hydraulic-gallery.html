<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pt_gallery">型号图集 · Auken Machinery</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="subpage">
<header class="sub-head">
  <a href="brick-hydraulic.html" class="sub-back" id="subBack" data-i18n="back">← 返回</a>
  <span class="sub-brand">AUKEN</span>
</header>

<main class="about gallery">
  <section class="block">
    <h2 class="block-title" id="gTitle">型号图集</h2>
    <p class="block-desc" id="gDesc"></p>
    <div class="gallery-grid" id="gGrid"></div>
  </section>

  <footer class="sub-foot">
    <span>Zhengzhou Auken Machinery Equipment Co., Ltd.</span>
  </footer>
</main>
<script src="subi18n.js"></script>
<!-- <<<AUKEN_GALLERY_START>>> -->
<script>
  var G = {
    "qt418": {
      zh: { name: "QT4-18", desc: "QT4-18 实拍图集" },
      en: { name: "QT4-18", desc: "QT4-18 photo gallery" },
      fr: { name: "QT4-18", desc: "Galerie photos QT4-18" },
      ar: { name: "QT4-18", desc: "معرض صور QT4-18" },
      imgs: ["QT4-18/QT4-18-1.webp"]
    },
    "qt415": {
      zh: { name: "QT4-15", desc: "QT4-15 实拍图集" },
      en: { name: "QT4-15", desc: "QT4-15 photo gallery" },
      fr: { name: "QT4-15", desc: "Galerie photos QT4-15" },
      ar: { name: "QT4-15", desc: "معرض صور QT4-15" },
      imgs: ["QT4-15/QT4-15-1.webp"]
    },
    "qt515": {
      zh: { name: "QT5-15", desc: "QT5-15 实拍图集" },
      en: { name: "QT5-15", desc: "QT5-15 photo gallery" },
      fr: { name: "QT5-15", desc: "Galerie photos QT5-15" },
      ar: { name: "QT5-15", desc: "معرض صور QT5-15" },
      imgs: ["QT5-15/QT5-15-1.webp"]
    },
    "qt615": {
      zh: { name: "QT6-15", desc: "QT6-15 实拍图集" },
      en: { name: "QT6-15", desc: "QT6-15 photo gallery" },
      fr: { name: "QT6-15", desc: "Galerie photos QT6-15" },
      ar: { name: "QT6-15", desc: "معرض صور QT6-15" },
      imgs: ["QT6-15/QT6-15-1.webp"]
    },
    "qt715": {
      zh: { name: "QT7-15", desc: "QT7-15 实拍图集" },
      en: { name: "QT7-15", desc: "QT7-15 photo gallery" },
      fr: { name: "QT7-15", desc: "Galerie photos QT7-15" },
      ar: { name: "QT7-15", desc: "معرض صور QT7-15" },
      imgs: ["QT7-15/QT7-15-1.webp"]
    },
    "qt1015": {
      zh: { name: "QT10-15", desc: "QT10-15 实拍图集" },
      en: { name: "QT10-15", desc: "QT10-15 photo gallery" },
      fr: { name: "QT10-15", desc: "Galerie photos QT10-15" },
      ar: { name: "QT10-15", desc: "معرض صور QT10-15" },
      imgs: ["QT10-15/QT10-15-1.webp"]
    }
  };
  var lang = (function(){ try { return sessionStorage.getItem('auken_lang'); } catch(e){ return null; } })() || document.documentElement.lang || 'zh';
  var m = (location.search.match(/[?&]m=([^&]+)/) || [,''])[1];
  var d = G[m];
  var gTitle = document.getElementById('gTitle');
  var gDesc = document.getElementById('gDesc');
  var grid = document.getElementById('gGrid');
  if (!d) {
    gTitle.textContent = '暂无图集';
    gDesc.textContent = '该型号暂未上传图片，敬请期待。';
  } else {
    gTitle.textContent = d[lang].name;
    gDesc.textContent = d[lang].desc;
    if (!d.imgs || !d.imgs.length) {
      var empty = document.createElement('p');
      empty.className = 'gallery-empty';
      empty.textContent = '暂无图片';
      grid.appendChild(empty);
    } else {
      d.imgs.forEach(function (src) {
        var fig = document.createElement('figure');
        fig.className = 'gallery-item';
        var im = document.createElement('img');
        im.src = 'img/' + src; im.alt = d[lang].name; im.loading = 'lazy';
        fig.appendChild(im);
        grid.appendChild(fig);
      });
    }
  }
  (function () {
    var back = document.getElementById('subBack');
    if (!back) return;
    var ref = document.referrer || '';
    var sameSite = ref.indexOf(location.protocol + '//' + location.host) === 0;
    back.addEventListener('click', function (e) {
      if (sameSite && history.length > 1) { e.preventDefault(); history.back(); }
    });
  })();
</script>
    <!-- <<<AUKEN_GALLERY_END>>> -->

<script src="cart.js"></script>
</body>
</html>
