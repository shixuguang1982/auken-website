<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pt_gallery">型号图集 · Auken Machinery</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="subpage">
<header class="sub-head">
  <a href="brick-manual.html" class="sub-back" id="subBack" data-i18n="back">← 返回</a>
  <span class="sub-brand">AUKEN</span>
</header>

<main class="about gallery">
  <section class="block">
    <h2 class="block-title" id="gTitle">型号图集</h2>
    <p class="block-desc" id="gDesc"></p>
    <div class="gallery-grid" id="gGrid"></div>
  </section>

  <footer class="sub-foot">
    <span>Zhengzhou Auken Machinery Equipment Co., Ltd.</span>
  </footer>
</main>
<script src="subi18n.js"></script>
<!-- <<<AUKEN_GALLERY_START>>> -->
<script>
  var G = {
    "qmy1": {
      zh: { name: "QMY-1", desc: "QMY-1 实拍图集" },
      en: { name: "QMY-1", desc: "QMY-1 photo gallery" },
      fr: { name: "QMY-1", desc: "Galerie photos QMY-1" },
      ar: { name: "QMY-1", desc: "معرض صور QMY-1" },
      imgs: ["QMY-1/QMY-1-1.webp"]
    },
    "qmy4": {
      zh: { name: "QMY-4", desc: "QMY-4 实拍图集" },
      en: { name: "QMY-4", desc: "QMY-4 photo gallery" },
      fr: { name: "QMY-4", desc: "Galerie photos QMY-4" },
      ar: { name: "QMY-4", desc: "معرض صور QMY-4" },
      imgs: ["QMY-4/QMY-4-1.webp"]
    },
    "qmy245a": {
      zh: { name: "QMY2-45A", desc: "QMY2-45A 实拍图集" },
      en: { name: "QMY2-45A", desc: "QMY2-45A photo gallery" },
      fr: { name: "QMY2-45A", desc: "Galerie photos QMY2-45A" },
      ar: { name: "QMY2-45A", desc: "معرض صور QMY2-45A" },
      imgs: ["QMY2-45A/QMY2-45A-1.webp"]
    },
    "qmy245b": {
      zh: { name: "QMY2-45B", desc: "QMY2-45B 实拍图集" },
      en: { name: "QMY2-45B", desc: "QMY2-45B photo gallery" },
      fr: { name: "QMY2-45B", desc: "Galerie photos QMY2-45B" },
      ar: { name: "QMY2-45B", desc: "معرض صور QMY2-45B" },
      imgs: ["QMY2-45B/QMY2-45B-1.webp"]
    },
    "qmy445a": {
      zh: { name: "QMY4-45A", desc: "QMY4-45A 实拍图集" },
      en: { name: "QMY4-45A", desc: "QMY4-45A photo gallery" },
      fr: { name: "QMY4-45A", desc: "Galerie photos QMY4-45A" },
      ar: { name: "QMY4-45A", desc: "معرض صور QMY4-45A" },
      imgs: ["QMY4-45A/QMY4-45A-1.webp"]
    },
    "qmy445b": {
      zh: { name: "QMY4-45B", desc: "QMY4-45B 实拍图集" },
      en: { name: "QMY4-45B", desc: "QMY4-45B photo gallery" },
      fr: { name: "QMY4-45B", desc: "Galerie photos QMY4-45B" },
      ar: { name: "QMY4-45B", desc: "معرض صور QMY4-45B" },
      imgs: ["QMY4-45B/QMY4-45B-1.webp"]
    }
  };
  var lang = (function(){ try { return sessionStorage.getItem('auken_lang'); } catch(e){ return null; } })() || document.documentElement.lang || 'zh';
  var m = (location.search.match(/[?&]m=([^&]+)/) || [,''])[1];
  var d = G[m];
  var gTitle = document.getElementById('gTitle');
  var gDesc = document.getElementById('gDesc');
  var grid = document.getElementById('gGrid');
  if (!d) {
    gTitle.textContent = '暂无图集';
    gDesc.textContent = '该型号暂未上传图片，敬请期待。';
  } else {
    gTitle.textContent = d[lang].name;
    gDesc.textContent = d[lang].desc;
    if (!d.imgs || !d.imgs.length) {
      var empty = document.createElement('p');
      empty.className = 'gallery-empty';
      empty.textContent = '暂无图片';
      grid.appendChild(empty);
    } else {
      d.imgs.forEach(function (src) {
        var fig = document.createElement('figure');
        fig.className = 'gallery-item';
        var im = document.createElement('img');
        im.src = 'img/' + src; im.alt = d[lang].name; im.loading = 'lazy';
        fig.appendChild(im);
        grid.appendChild(fig);
      });
    }
  }
  (function () {
    var back = document.getElementById('subBack');
    if (!back) return;
    var ref = document.referrer || '';
    var sameSite = ref.indexOf(location.protocol + '//' + location.host) === 0;
    back.addEventListener('click', function (e) {
      if (sameSite && history.length > 1) { e.preventDefault(); history.back(); }
    });
  })();
</script>
    <!-- <<<AUKEN_GALLERY_END>>> -->

<script src="cart.js"></script>
</body>
</html>
