<!-- <<<AUKEN_GALLERY_START>>> -->
<script>
  var G = {
    "batching": {
      zh: { name: "配料机", desc: "配料机 产品图集" },
      en: { name: "Batching Machine", desc: "Batching Machine product gallery" },
      fr: { name: "Batching Machine", desc: "Galerie produit Batching Machine" },
      ar: { name: "Batching Machine", desc: "معرض منتجات Batching Machine" },
      imgs: ["PL-800.webp"]
    },
    "mixer": {
      zh: { name: "强制搅拌机", desc: "强制搅拌机 产品图集" },
      en: { name: "Forced Mixer", desc: "Forced Mixer product gallery" },
      fr: { name: "Forced Mixer", desc: "Galerie produit Forced Mixer" },
      ar: { name: "Forced Mixer", desc: "معرض منتجات Forced Mixer" },
      imgs: ["JS-500.webp"]
    },
    "pan": {
      zh: { name: "平口搅拌机", desc: "平口搅拌机 产品图集" },
      en: { name: "Pan Mixer", desc: "Pan Mixer product gallery" },
      fr: { name: "Pan Mixer", desc: "Galerie produit Pan Mixer" },
      ar: { name: "Pan Mixer", desc: "معرض منتجات Pan Mixer" },
      imgs: ["JW-550.webp"]
    },
    "conveyor": {
      zh: { name: "皮带输送机", desc: "皮带输送机 产品图集" },
      en: { name: "Belt Conveyor", desc: "Belt Conveyor product gallery" },
      fr: { name: "Belt Conveyor", desc: "Galerie produit Belt Conveyor" },
      ar: { name: "Belt Conveyor", desc: "معرض منتجات Belt Conveyor" },
      imgs: ["BC-8.webp"]
    },
    "feeder": {
      zh: { name: "上板机", desc: "上板机 产品图集" },
      en: { name: "Pallet Feeder", desc: "Pallet Feeder product gallery" },
      fr: { name: "Pallet Feeder", desc: "Galerie produit Pallet Feeder" },
      ar: { name: "Pallet Feeder", desc: "معرض منتجات Pallet Feeder" },
      imgs: ["PF-600.webp"]
    },
    "stacker": {
      zh: { name: "码垛机/叠板机", desc: "码垛机/叠板机 产品图集" },
      en: { name: "Palletizer", desc: "Palletizer product gallery" },
      fr: { name: "Palletizer", desc: "Galerie produit Palletizer" },
      ar: { name: "Palletizer", desc: "معرض منتجات Palletizer" },
      imgs: ["SP-1200.webp"]
    },
    "color": {
      zh: { name: "彩色面料机", desc: "彩色面料机 产品图集" },
      en: { name: "Color Face Mix", desc: "Color Face Mix product gallery" },
      fr: { name: "Color Face Mix", desc: "Galerie produit Color Face Mix" },
      ar: { name: "Color Face Mix", desc: "معرض منتجات Color Face Mix" },
      imgs: ["CF-200.webp"]
    },
    "pallet": {
      zh: { name: "托板", desc: "托板 产品图集" },
      en: { name: "Pallet", desc: "Pallet product gallery" },
      fr: { name: "Pallet", desc: "Galerie produit Pallet" },
      ar: { name: "Pallet", desc: "معرض منتجات Pallet" },
      imgs: ["PT-880.webp"]
    },
    "clamp": {
      zh: { name: "夹砖器/叉车", desc: "夹砖器/叉车 产品图集" },
      en: { name: "Brick Clamp", desc: "Brick Clamp product gallery" },
      fr: { name: "Brick Clamp", desc: "Galerie produit Brick Clamp" },
      ar: { name: "Brick Clamp", desc: "معرض منتجات Brick Clamp" },
      imgs: ["BC-1T.webp"]
    }
  };
  var lang = (function(){ try { return sessionStorage.getItem('auken_lang'); } catch(e){ return null; } })() || document.documentElement.lang || 'zh';
  var m = (location.search.match(/[?&]m=([^&]+)/) || [,''])[1];
  var d = G[m];
  var gTitle = document.getElementById('gTitle');
  var gDesc = document.getElementById('gDesc');
  var grid = document.getElementById('gGrid');
  if (!d) {
    gTitle.textContent = '暂无图集';
    gDesc.textContent = '该型号暂未上传图片，敬请期待。';
  } else {
    gTitle.textContent = d[lang].name;
    gDesc.textContent = d[lang].desc;
    if (!d.imgs || !d.imgs.length) {
      var empty = document.createElement('p');
      empty.className = 'gallery-empty';
      empty.textContent = '暂无图片';
      grid.appendChild(empty);
    } else {
      d.imgs.forEach(function (src) {
        var fig = document.createElement('figure');
        fig.className = 'gallery-item';
        var im = document.createElement('img');
        im.src = 'img/' + src; im.alt = d[lang].name; im.loading = 'lazy';
        fig.appendChild(im);
        grid.appendChild(fig);
      });
    }
  }
  (function () {
    var back = document.getElementById('subBack');
    if (!back) return;
    var ref = document.referrer || '';
    var sameSite = ref.indexOf(location.protocol + '//' + location.host) === 0;
    back.addEventListener('click', function (e) {
      if (sameSite && history.length > 1) { e.preventDefault(); history.back(); }
    });
  })();
</script>
    <!-- <<<AUKEN_GALLERY_END>>> -->

<script src="cart.js"></script>
</body>
</html>
